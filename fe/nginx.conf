server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip cho asset tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Healthcheck endpoint cho Docker Compose
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache lâu cho asset có hash (CRA dùng content hash)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA routing — mọi route đều fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không cache index.html để FE deploy mới được áp dụng ngay
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
